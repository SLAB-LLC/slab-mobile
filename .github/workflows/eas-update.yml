name: EAS Update

on:
  workflow_dispatch:
    inputs:
      message:
        description: 'Update message (what changed)'
        required: true
        default: 'UI update'

jobs:
  update:
    name: EAS Update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # --environment loads the same EAS variables the builds get (Supabase URL and key). Without it the
      # bundle had no Supabase URL, crashed on launch, and phones rolled back to the build (updatePreviouslyFailed)
      - name: Publish update
        run: eas update --branch production --environment production --message "${{ github.event.inputs.message }}" --non-interactive

      - name: Check the update has the Supabase URL
        run: |
          if ! grep -q "supabase.co" dist/_expo/static/js/ios/*.hbc; then
            echo "::error::The published bundle has no Supabase URL; check the production environment variables on expo.dev"
            exit 1
          fi

      # What the phones see: which branch the production channel serves, and the builds it serves
      - name: Show channel and recent builds
        continue-on-error: true
        run: |
          eas channel:view production --non-interactive
          eas build:list --platform ios --limit 3 --non-interactive --json | node -e 'const b=JSON.parse(require("fs").readFileSync(0,"utf8")); for (const x of b) console.log(x.id, x.status, "channel=" + x.channel, "runtime=" + x.runtimeVersion, "version=" + x.appVersion + " (" + x.appBuildVersion + ")", x.gitCommitHash, x.createdAt)'
