<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; background:#000; overflow:hidden; -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent; }
  body{ position:relative; }
  button{ font:inherit; color:inherit; }
  .bt{ position:absolute; inset:0; z-index:400; pointer-events:none; }
  .bt.live{ pointer-events:auto; }
  .bt-layer{ position:absolute; inset:0; }
  .bt-intro{ z-index:3; background:#000; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; transform:translateY(-101%); }
  .bt-co{ z-index:3; visibility:hidden; }
  .bt-co.bt-on{ visibility:visible; }
  .bt-half{ position:absolute; inset:0; background:#000; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; }
  .bt-left{ clip-path:inset(0 50% 0 0); }
  .bt-right{ clip-path:inset(0 0 0 50%); }
  .bt-co.bt-part .bt-half{ transition:transform 0.7s cubic-bezier(0.77, 0, 0.175, 1); }
  .bt-co.bt-part .bt-left{ transform:translateX(-52%); }
  .bt-co.bt-part .bt-right{ transform:translateX(52%); }
  .bt-half::after{ content:""; position:absolute; top:0; bottom:0; width:2px; background:var(--ace-gold, #daae5d); opacity:0; transition:opacity 0.2s; }
  .bt-left::after{ right:50%; } .bt-right::after{ left:50%; }
  .bt-co.bt-crack .bt-half::after, .bt-co.bt-part .bt-half::after{ opacity:1; box-shadow:0 0 12px var(--ace-gold, #daae5d); }
  .bt-intro img{ width:62%; opacity:0; }
  .bt-tag{ font:400 12px/1 'Courier Prime', ui-monospace, monospace; letter-spacing:0.25em; color:#F4711E; opacity:0; transition:opacity 0.2s; }
  .bt-co .bt-tag{ font:700 11px/1 'Barlow', sans-serif; letter-spacing:0.3em; color:var(--ace-gold, #daae5d); }
  .bt-logos{ display:flex; align-items:center; gap:14px; opacity:0; }
  .bt-logos img:first-child{ width:150px; } .bt-logos img:last-child{ width:64px; }
  .bt-logos i{ font:400 24px/1 'Barlow', sans-serif; font-style:normal; color:var(--ace-gold, #daae5d); }
  .bt-on{ transform:none; }
  .bt-wipe{ transition:transform 0.55s cubic-bezier(0.77, 0, 0.175, 1); transform:translateY(-101%); }
  .bt-login{ z-index:2; display:flex; flex-direction:column; padding:56px 26px 22px; font:400 13px/1.4 'Courier Prime', ui-monospace, monospace;
    background:radial-gradient(120% 90% at 50% 45%, #220c02, #070200 70%); color:#ff8a2a; text-shadow:0 0 6px rgba(244,113,30,0.85), 0 0 1px #ffb070; animation:bt-crt 6s infinite; }
  .bt-login[hidden]{ display:none; }
  .bt-login::after{ content:""; position:absolute; inset:0; pointer-events:none; background:repeating-linear-gradient(180deg, rgba(0,0,0,0.32) 0 1px, transparent 1px 3px); box-shadow:inset 0 0 70px rgba(0,0,0,0.9); }
  @keyframes bt-crt{ 0%, 96%, 100%{ filter:none; } 97%{ filter:brightness(0.72); } 98%{ filter:none; } 99%{ filter:brightness(0.86); } }
  .bt-beaker{ display:block; width:76px; height:114px; margin:0 auto 20px; image-rendering:pixelated; filter:drop-shadow(0 0 5px rgba(244,113,30,0.8)); }
  .bt-big{ margin:0; font:400 13px/1 'Courier Prime', ui-monospace, monospace; letter-spacing:0; color:#ff9a45; text-align:center; }
  .bt-sub{ margin:12px 0 22px; text-align:center; font-size:11px; letter-spacing:0.22em; }
  .bt-box{ border:2px solid #ff8a2a; padding:4px 14px 14px; box-shadow:0 0 10px rgba(244,113,30,0.4), inset 0 0 10px rgba(244,113,30,0.15); }
  .bt-box label{ display:block; margin:12px 0 4px; font-size:11px; letter-spacing:0.22em; }
  .bt-box input{ width:100%; background:rgba(244,113,30,0.08); border:0; border-bottom:2px solid #ff8a2a; border-radius:0; padding:9px 8px; color:#ffb070; font:inherit; font-size:16px; text-shadow:inherit; -webkit-appearance:none; appearance:none; }
  .bt-box input::placeholder{ color:rgba(255,138,42,0.4); }
  .bt-box input:focus{ outline:none; background:rgba(244,113,30,0.18); }
  .bt-go{ margin-top:18px; border:0; background:#F4711E; color:#150600; font:700 16px/1 'Courier Prime', ui-monospace, monospace; padding:14px 0; letter-spacing:0.12em; text-shadow:none; box-shadow:0 0 16px rgba(244,113,30,0.65); cursor:pointer; }
  .bt-go:active{ transform:translateY(2px); }
  .bt-err{ min-height:18px; margin-top:10px; color:#ffd0a8; font-size:12px; }
  .bt-forgot{ margin-top:12px; align-self:center; background:none; border:0; color:inherit; font:inherit; font-size:12px; text-decoration:underline; text-underline-offset:3px; cursor:pointer; text-shadow:inherit; }
  .bt-msg{ position:absolute; left:26px; right:26px; top:46%; z-index:2; padding:16px 12px 14px; text-align:center; font:700 18px/1.2 'Courier Prime', ui-monospace, monospace; letter-spacing:0.18em; color:#ffb070;
    background:#0c0400; border:2px solid #ff8a2a; box-shadow:0 0 14px rgba(244,113,30,0.55), inset 0 0 12px rgba(244,113,30,0.2); text-shadow:0 0 8px rgba(244,113,30,0.95), 0 0 1px #ffd0a8; opacity:0; transform:scaleY(0.05); transition:transform 0.18s steps(3), opacity 0.1s; }
  .bt-msg.on{ opacity:1; transform:none; }
  .bt-msg small{ display:block; margin-top:8px; font-size:10px; letter-spacing:0.22em; color:#ff8a2a; font-weight:400; }
  .bt-msg .cur{ display:inline-block; width:9px; height:16px; margin-left:4px; vertical-align:-2px; background:#ff8a2a; box-shadow:0 0 8px #ff8a2a; animation:bt-blink 0.8s steps(1) infinite; }
  @keyframes bt-blink{ 50%{ opacity:0; } }
  .bt-foot{ margin-top:auto; display:flex; justify-content:space-between; font-size:10px; letter-spacing:0.14em; opacity:0.7; }
  @media (prefers-reduced-motion: reduce){ .bt-login{ animation:none; } .bt-wipe{ transition:none; } }
  .bt-login{ padding-top:calc(56px + env(safe-area-inset-top)); padding-bottom:calc(22px + env(safe-area-inset-bottom)); }
</style>
</head>

// The app's sign-in page: the demo's opening (SLAB intro flicker, then the 4E CRT login), signing in
// through the native app. build.py puts the demo's own beaker and SLAB letters (BT_DEMO) above this.
const $ = (id) => document.getElementById(id);
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const btSleep = (ms) => new Promise((r) => setTimeout(r, ms));

// ---- talking to the app ----
let appSeq = 0;
const appWaits = {};
function appSend(type, payload, id) {
  if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(JSON.stringify({ id, type, payload }));
}
function appCall(type, payload) {
  return new Promise((resolve, reject) => {
    const id = ++appSeq;
    appWaits[id] = { resolve, reject };
    appSend(type, payload, id);
  });
}
window.__appReply = (id, ok, result) => {
  const w = appWaits[id];
  if (!w) return;
  delete appWaits[id];
  ok ? w.resolve(result) : w.reject(new Error(String(result || 'Something went wrong')));
};
const haptic = (kind) => appSend('haptic', kind);

const BT_BIG = { S:['█████','█    ','█████','    █','█████'], L:['█    ','█    ','█    ','█    ','█████'], A:[' ███ ','█   █','█████','█   █','█   █'], B:['████ ','█   █','████ ','█   █','████ '] };
$('bt-big').textContent = [0,1,2,3,4].map(r => [...'SLAB'].map(ch => BT_BIG[ch][r]).join('  ')).join('\n');
(function btBeaker(cv){
  const g = cv.getContext('2d'), W = 28, H = 42, Y = 12, O = '#ff8a2a', D = '#c4500f';
  const ring = (x, y) => { g.fillRect(x, y - 1, 2, 1); g.fillRect(x, y + 2, 2, 1); g.fillRect(x - 1, y, 1, 2); g.fillRect(x + 2, y, 1, 2); };
  const inside = (x, y) => { y -= Y; if (y < 10 || y > 27) return false; return Math.abs(x + 0.5 - 14) <= 3 + (y - 10) * 0.62; };
  const open = (x, y) => y < Y || (y < Y + 10 ? x >= 12 && x <= 15 : inside(x, y));
  const fits = (x, y) => [[0,-1],[1,-1],[-1,0],[2,0],[-1,1],[2,1],[0,2],[1,2]].every(([dx, dy]) => open(x + dx, y + dy));
  const bubbles = Array.from({ length:4 }, (_, i) => ({ x:10 + (i * 3) % 8, y:Y + 26 - i * 4, v:0.28 + (i % 3) * 0.08 }));
  function frame(){
    g.clearRect(0, 0, W, H); g.fillStyle = O;
    g.fillRect(10, Y, 8, 1); g.fillRect(10, Y, 1, 2); g.fillRect(17, Y, 1, 2); g.fillRect(11, Y + 2, 1, 8); g.fillRect(16, Y + 2, 1, 8);
    for (let y = 10; y <= 27; y++) { const h = Math.round(3 + (y - 10) * 0.62); g.fillRect(14 - h - 1, Y + y, 1, 1); g.fillRect(14 + h, Y + y, 1, 1); }
    g.fillRect(2, Y + 28, 24, 1);
    for (let y = Y + 16; y <= Y + 27; y++) for (let x = 0; x < W; x++) if (inside(x, y)) { g.fillStyle = (x + y) % 5 ? D : '#a8430c'; g.fillRect(x, y, 1, 1); }
    g.fillStyle = O; for (let x = 0; x < W; x++) if (inside(x, Y + 16)) g.fillRect(x, Y + 16, 1, 1);
    bubbles.forEach(b => {
      b.y -= b.v;
      if (b.y < Y + 12) b.x += (13 - b.x) * 0.35;
      if (b.y < -3) { b.y = Y + 24; b.x = 10 + Math.floor(Math.random() * 7); }
      let x = Math.round(b.x); const y = Math.round(b.y);
      for (let k = 0; k < 8 && !fits(x, y); k++) x += x < 13 ? 1 : -1;
      if (fits(x, y)) { b.x = x; ring(x, y); }
    });
  }
  frame(); if (!reduceMotion) setInterval(() => { if (!$('bt-login').hidden) frame(); }, 90);
})($('bt-beaker'));

const LOGIN = window.SLAB_LOGIN || {};
window.appSetBuild = (b) => { const f = document.querySelector('.bt-foot'); f.textContent = 'BUILD ' + b; f.style.justifyContent = 'center'; f.style.textAlign = 'center'; };
if (LOGIN.build) window.appSetBuild(LOGIN.build);

async function btFlicker(el) {
  if (reduceMotion) { el.style.opacity = 1; return; }
  for (let i = 0; i < 6; i++) { el.style.opacity = i % 2 ? 0 : 1; await btSleep(60); }
  el.style.opacity = 1;
}
async function btWipe(layer) {
  layer.classList.add('bt-wipe');
  layer.classList.remove('bt-on');
  await btSleep(reduceMotion ? 0 : 600);
  layer.classList.remove('bt-wipe');
}

(async function intro() {
  const intro = $('bt-intro'), img = intro.querySelector('img'), tag = intro.querySelector('.bt-tag');
  img.style.opacity = 0; tag.style.opacity = 0;
  intro.classList.add('bt-on');
  $('bt-login').hidden = false;
  await btSleep(250);
  await btFlicker(img);
  await btSleep(350); tag.style.opacity = 1;
  await btSleep(550);
  await btWipe(intro);
})();

function friendly(msg) {
  if (/invalid login|invalid credentials/i.test(msg)) return 'ERR: user id or passcode not recognized.';
  if (/not confirmed/i.test(msg)) return 'ERR: confirm your email first, then log on.';
  if (/network|fetch/i.test(msg)) return 'ERR: no signal. Check your connection.';
  return 'ERR: ' + msg;
}

let busy = false;
$('bt-login').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (busy) return;
  const email = $('bt-email').value.trim(), pw = $('bt-pw').value;
  const bad = !/^\S+@\S+\.\S+$/.test(email) ? 'ERR: email not recognized. Use your work email.' : pw.length < 6 ? 'ERR: passcode too short (min 6).' : '';
  $('bt-err').textContent = bad;
  if (bad) { (bad.includes('email') ? $('bt-email') : $('bt-pw')).focus(); haptic('wrong'); return; }

  busy = true;
  document.activeElement && document.activeElement.blur();
  const msg = $('bt-msg');
  msg.innerHTML = '&gt; <span>CHECKING</span><i class="cur"></i><small></small>';
  msg.classList.add('on');
  let who;
  try {
    who = await appCall('signIn', { email, password: pw });
  } catch (err) {
    msg.classList.remove('on');
    $('bt-err').textContent = friendly(err.message);
    haptic('wrong');
    busy = false;
    return;
  }
  haptic('success');
  const line = msg.querySelector('span'), sm = msg.querySelector('small'), t = 'ACCESS GRANTED';
  for (let i = 1; i <= t.length; i++) { line.textContent = t.slice(0, i); await btSleep(reduceMotion ? 0 : 38); }
  if (who && who.company) sm.textContent = 'company: ' + String(who.company).toUpperCase();
  await btSleep(800);
  appSend('enter');
});

$('bt-forgot').addEventListener('click', async () => {
  const email = $('bt-email').value.trim();
  if (!/^\S+@\S+\.\S+$/.test(email)) { $('bt-err').textContent = 'ERR: type your user id (work email) first.'; $('bt-email').focus(); return; }
  $('bt-err').textContent = '> sending...';
  try {
    await appCall('reset', { email });
    $('bt-err').textContent = '> reset link sent to your work email';
  } catch (err) {
    $('bt-err').textContent = friendly(err.message);
  }
});

</script>
</body>
</html>
